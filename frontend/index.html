<html>
<head>
    <title>Message Saver</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <div class="container">

        <h1>Message Saver</h1>

        <p>Enter your name and save it to MongoDB.</p>

        <input
            type="text"
            id="name"
            placeholder="Enter your name"
        >

        <button id="save-button">
            Save Name
        </button>

        <p id="result"></p>

        <h2>Saved Names</h2>
        <h3>Unsaved</h3>

        <ul id="message-list"></ul>

    </div>
</body>
</html>
